<!-- Topic: Responsive Hero Section
2. Build a hero section where an image and text block sit side-by-side on desktops, but stack vertically on mobile devices. -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bootstrap Responsive Hero Section</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">  
    </head>
    <body>
        <div class="container mt-5">
            <div class="row align-items-center">
                <div class="col-12 col-md-6">
                    <img src="/images/bootstrap-1.webp" class="img-fluid" alt="Hero Image">
                </div>
                <div class="col-12 col-md-6">
                    <h1>Welcome to Our Website</h1>
                    <p>This is a responsive hero section. On larger screens, the image and text are side-by-side, while on smaller screens, they stack vertically.</p>
                    <a href="#" class="btn btn-primary">Learn More</a>
                </div>
            </div>
        </div>
    </body>
</html>
