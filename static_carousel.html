<!--Topic: The Static Carousel Foundation
1. Create a simple landing page hero section featuring a carousel with three placeholder images. This establishes the muscle memory for the required class hierarchy. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Carousel</title>
    <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <header class="hero-section">
        <div class="carousel slide" id="staticCarousel" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#staticCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#staticCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#staticCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="./images/Bootstrap5.jpg" class="d-block w-100" style="height: 500px;" alt="Slide 1">
                </div>
                <div class="carousel-item">
                    <img src="./images/reactjs.jpg" class="d-block w-100" style="height: 500px;" alt="Slide 2">
                </div>
                <div class="carousel-item">
                    <img src="./images/bootstrap-1.webp" class="d-block w-100" style="height: 500px;" alt="Slide 3">
                </div>
            </div>
        </div>
    </header>

    <!-- Bootstrap JS CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
