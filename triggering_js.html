<!-- Topic: Triggering Interaction via JavaScript
2. Instead of using the default arrows, create a set of custom buttons outside the carousel that 'jump' to specific slides using the Bootstrap JavaScript API. -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triggering Interaction via JavaScript</title>
    <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="hero-section container-fluid p-0 m-0">
        <div class="carousel slide" id="triggeringCarousel" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#triggeringCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#triggeringCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#triggeringCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="./images/Bootstrap5.jpg" class="d-block w-100" style="height: 500px;" alt="Slide 1">
                </div>
                <div class="carousel-item">
                    <img src="./images/reactjs.jpg" class="d-block w-100" style="height: 500px;" alt="Slide 2">
                </div>
                <div class="carousel-item">
                    <img src="./images/bootstrap-1.webp" class="d-block w-100" style="height: 500px;" alt="Slide 3">
                </div>
            </div>
        </div>

        <!-- Custom Buttons to Trigger Carousel Slides -->
        <div class="custom-buttons text-center mt-3">
            <button id="slide1Btn" class="btn btn-primary mx-2">Go to Slide 1</button>
            <button id="slide2Btn" class="btn btn-secondary mx-2">Go to Slide 2</button>
            <button id="slide3Btn" class="btn btn-success mx-2">Go to Slide 3</button>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript to Trigger Carousel Slides -->
    <script>
        const carouselElement = document.getElementById('triggeringCarousel');
        const carousel = new bootstrap.Carousel(carouselElement);

        document.getElementById('slide1Btn').addEventListener('click', () => {
            carousel.to(0); // Go to Slide 1
        });

        document.getElementById('slide2Btn').addEventListener('click', () => {
            carousel.to(1); // Go to Slide 2
        });

        document.getElementById('slide3Btn').addEventListener('click', () => {
            carousel.to(2); // Go to Slide 3
        });
    </script>
</body>
</html>
